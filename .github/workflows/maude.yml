name: Maude
run-name: ${{ github.actor }} is running Maude in GitHub Actions 🚀
on: [push]
jobs:
  run-maude:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Install Maude
          uses: ConorMacBride/install-package@v1
          with:
            apt: maude
        - name: Use Maude
          run: maude full-maude.maude
        - name: Compare the two storage models
          run: |
            out=$(maude -no-banner -batch src/StorageCompare.maude < /dev/null 2>&1)
            echo "$out"
            # maude exits 0 on warnings, so fail explicitly on any warning or kinded result
            ! grep -Eq '^Warning|^result \[' <<< "$out"
        - name: Run sem/ semantics test suite
          run: bash src/sem/run-tests.sh
